<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guardian Shield - Final Warning</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 20%, #4b0000, #140000 70%);
    color: #ffdada;
  }
  .card {
    width: min(900px, 92vw);
    border: 2px solid #ff3b3b;
    border-radius: 22px;
    background: rgba(40, 0, 0, 0.8);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 32px rgba(255, 60, 60, 0.35);
    padding: 36px 28px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid #ff8a8a;
    background: rgba(255, 59, 59, 0.2);
    color: #fff;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  h1 {
    font-size: clamp(36px, 7vw, 72px);
    line-height: 1;
    color: #ff4c4c;
    text-shadow: 0 0 18px rgba(255, 0, 0, 0.45);
    margin-bottom: 10px;
  }
  .host {
    margin: 8px auto 18px;
    display: inline-block;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #fff;
    font-weight: 700;
    word-break: break-all;
  }
  .line {
    font-size: clamp(16px, 2.3vw, 22px);
    margin-bottom: 10px;
  }
  .line strong { color: #ffb5b5; }
  .notice {
    margin: 14px 0 22px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ff7272;
    background: rgba(255, 60, 60, 0.16);
    color: #ffd6d6;
    font-weight: 700;
  }
  .btn {
    display: inline-block;
    margin-top: 6px;
    padding: 12px 22px;
    border-radius: 999px;
    border: none;
    font-size: 16px;
    font-weight: 800;
    color: #1a0000;
    background: linear-gradient(180deg, #ffd166, #ffb703);
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">FINAL WARNING · ATTEMPT #__COUNT__</div>
    <h1>NUH UH</h1>
    <div class="host">Blocked site: __HOST__</div>
    <p class="line">You are not allowed to visit this site. <strong>Try __COUNT__/3</strong>.</p>
    <p class="line">Access is denied and this activity is logged.</p>
    <div class="notice">Guardian dashboard has been notified automatically.</div>
    <button id="safeBtn" class="btn" type="button">Back To Safe Browsing</button>
  </div>

  <script>
    const HOST = "__HOST__";
    const SAFE_URL = __SAFE_URL_JSON__;
    const params = new URLSearchParams(window.location.search || "");
    const POPUP_MODE = params.get("popup") === "1";
    const HOLD_SECONDS = Math.max(1, parseInt(params.get("hold") || "20", 10) || 20);
    const HOLD_MS = HOLD_SECONDS * 1000;
    const SAFE_LOCAL_URL = "http://127.0.0.1/__guardian_safe";

    (function stabilizeBlockedPageRoute() {
      try {
        const h = (window.location.hostname || "").toLowerCase();
        const isLocal = h === "127.0.0.1" || h === "localhost" || h === "::1";
        const isCanonicalPath = (window.location.pathname || "") === "/__guardian_block";
        if (!isLocal || !isCanonicalPath) {
          const popupQ = POPUP_MODE ? "&popup=1" : "";
          const canonical = `http://127.0.0.1/__guardian_block?host=${encodeURIComponent(HOST)}${popupQ}`;
          window.location.replace(canonical);
        }
      } catch (_err) {}
    })();

    document.getElementById("safeBtn").addEventListener("click", () => {
      const targetUrl = SAFE_LOCAL_URL;
      window.location.href = targetUrl;
    });

    (function oneTimePopupFlow() {
      const targetUrl = SAFE_LOCAL_URL;

      if (POPUP_MODE) {
        setTimeout(() => {
          try {
            const next = window.open(targetUrl, "_blank", "noopener,noreferrer");
            if (!next) {
              window.location.replace(targetUrl);
              return;
            }
            window.open("", "_self");
            window.close();
          } catch (_e) {}
        }, HOLD_MS);
        return;
      }

      setTimeout(() => {
        try {
          window.location.replace(targetUrl);
        } catch (_e) {}
      }, HOLD_MS);
    })();
  </script>
</body>
</html>
